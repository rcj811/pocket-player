name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    name: 編譯 APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 準備 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 還原固定簽章
        run: base64 -d ci/debug.keystore.b64 > ci/debug.keystore

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 測試並編譯
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      # 把結果與錯誤摘要推到 ci-logs 分支，方便不用登入也能查看
      - name: 保存建置紀錄
        if: always()
        run: |
          {
            echo "run=${{ github.run_number }} status=${{ job.status }} sha=${{ github.sha }}"
            echo "---- errors ----"
            grep -E "^e: |error:|FAILED|What went wrong|Exception|expected:<" -A4 build.log | head -250 || true
            echo "---- tail ----"
            tail -80 build.log || true
          } > summary.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          cp summary.txt /tmp/summary.txt
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          mkdir -p logs && cp /tmp/summary.txt logs/latest.txt
          git add -f logs/latest.txt
          git commit -m "CI ${{ github.run_number }}: ${{ job.status }}" > /dev/null
          git push -f origin HEAD:ci-logs

      - name: 整理檔名
        id: names
        run: |
          echo "np=$(grep -oP 'NewPipeExtractor:\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "pocket-player-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk pocket-player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-player-apk
          path: pocket-player-${{ github.run_number }}.apk

      - name: 發布到 Releases（手機可直接下載）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 隨身聽 build ${{ github.run_number }}
          body: |
            YouTube 解析引擎 NewPipeExtractor ${{ steps.names.outputs.np }}
            ${{ github.event.head_commit.message || '自動更新' }}
          files: |
            pocket-player-${{ github.run_number }}.apk
            pocket-player.apk
          prerelease: false
          make_latest: true

  smoke:
    name: 模擬器實測
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocket-player-apk
      - name: 準備
        run: |
          mv pocket-player-*.apk pocket-player.apk
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 執行實測
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh
      - name: 上傳實測紀錄到 ci-logs
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/smoke && cp -r smoke/* /tmp/smoke/ 2>/dev/null || true
          git fetch origin ci-logs
          git checkout -f -B ci-logs origin/ci-logs
          rm -rf logs/smoke && mkdir -p logs/smoke && cp -r /tmp/smoke/* logs/smoke/ 2>/dev/null || true
          git add -f logs/smoke
          git commit -m "smoke ${{ github.run_number }}" > /dev/null || true
          git push origin HEAD:ci-logs
